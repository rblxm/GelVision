name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # PyInstaller for Streamlit requires specific hidden imports and data collections
        pyinstaller --noconfirm --onedir --windowed `
          --add-data="gelvision;gelvision/" `
          --copy-metadata streamlit `
          --hidden-import streamlit `
          launcher.py
        
        # Rename the output folder
        Rename-Item -Path "dist\launcher" -NewName "GelVision"
        
        # Zip it
        Compress-Archive -Path "dist\GelVision" -DestinationPath "GelVision-Windows.zip"

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: GelVision-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
